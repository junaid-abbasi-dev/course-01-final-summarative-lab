<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Worldly Dictionary</title>
</head>
<body>
    <h1>Worldly Dictionary</h1>
    <div id="form-container">
        <form action="submit" id="form">
            <label for="word">Search for a Word</label>
            <input type="text" id="word" placeholder="Enter a word..">
            <button id="submit-btn">Submit</button>
        </form>
    </div>

    <div id="word-info">
    </div>

    <section id="favorites-section">
        <h2>Favorite Words</h2>
        <ul id="favorites-list"></ul>
    </section>
</body>
</html>
